<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg-primary:#0d1a2f;--bg-secondary:#17364f;--accent-color:#09d8c7;--accent-secondary:#bd0927;--text-main:#f3f4f6;--border-color:rgba(9,216,199,.2)}
*{box-sizing:border-box}body{margin:0;background:var(--bg-primary);color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}.theme-card-bg{background:var(--bg-secondary);border:1px solid var(--border-color)}.theme-accent-bg{background:var(--accent-color)}.theme-accent-text{color:var(--accent-color)}.theme-accent-border{border-color:var(--accent-color)}.no-scrollbar::-webkit-scrollbar{display:none}.drag-item{touch-action:auto;cursor:default;transition:transform .15s,box-shadow .15s,opacity .15s}.drag-item.longpress-pending{transform:scale(.99)}.drag-item.dragging{opacity:.92;transform:scale(1.035) translateY(-4px);outline:2px solid var(--accent-color);box-shadow:0 14px 32px rgba(0,0,0,.38),0 0 0 4px rgba(9,216,199,.18);z-index:20}.drag-placeholder{border:2px dashed color-mix(in srgb,var(--accent-color) 55%,transparent);background:color-mix(in srgb,var(--accent-color) 10%,transparent);min-width:0;}
.drag-item.dragging::after{content:"移動中";position:absolute;top:8px;right:8px;background:var(--accent-color);color:#07151f;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:800;pointer-events:none}.drag-handle{touch-action:auto;cursor:default}.no-scrollbar{scrollbar-width:none}.active-tab{color:var(--accent-color)!important;transform:scale(1.06)}.selected{border:3px solid #10b981!important;box-shadow:0 0 15px rgba(16,185,129,.35)}button:disabled{pointer-events:none}.modal-scroll{max-height:85vh;overflow:auto}.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}.hscroll::-webkit-scrollbar{display:none}.hscroll>*{flex:0 0 118px;scroll-snap-align:start}.closet-scroller{touch-action:auto;overscroll-behavior:contain;display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,minmax(0,1fr));grid-auto-columns:148px;gap:10px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 8px;scroll-snap-type:x proximity}.closet-scroller::-webkit-scrollbar{height:4px}.closet-scroller::-webkit-scrollbar-thumb{background:var(--accent-color);border-radius:999px}.closet-scroller>.drag-item{min-width:148px;scroll-snap-align:start}.closet-scroller>.empty-cat{grid-row:1 / span 2;min-width:100%}.outfit-preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.outfit-card{border-radius:16px;overflow:hidden}.outfit-image{height:190px;background:rgba(0,0,0,.12)}.outfit-image img{width:100%;height:100%;object-fit:cover}.color-dot{transition:transform .15s,box-shadow .15s}.app-version{position:fixed;right:8px;bottom:72px;z-index:35;font-size:9px;line-height:1;padding:4px 6px;border-radius:999px;background:rgba(0,0,0,.24);color:rgba(255,255,255,.38);pointer-events:none;letter-spacing:.02em;backdrop-filter:blur(4px)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:100;max-width:90%;padding:10px 16px;border-radius:999px;background:#111827;color:#fff;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.closet-row{display:grid;grid-template-rows:repeat(2,minmax(0,1fr));grid-auto-flow:column;grid-auto-columns:145px;gap:10px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}.choice-row{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}.choice-card{flex:0 0 128px}.closet-row::-webkit-scrollbar,.choice-row::-webkit-scrollbar{height:4px}

/* Completed outfit screen */
.outfit-preview-screen{
  min-height:calc(100vh - 180px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:24px;
  padding:12px 4px 28px;
}
.outfit-preview-items{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  align-items:start;
}
.outfit-preview-item{
  min-width:0;
  text-align:center;
}
.outfit-preview-photo{
  width:100%;
  aspect-ratio:1/1.12;
  border-radius:16px;
  overflow:hidden;
  background:var(--card-bg);
  border:1px solid color-mix(in srgb,var(--accent-color) 22%,transparent);
}
.outfit-preview-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.outfit-preview-name{
  margin-top:8px;
  font-weight:700;
  font-size:14px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.outfit-preview-color{
  margin-top:3px;
  font-size:12px;
  opacity:.7;
}
.outfit-preview-actions{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.outfit-preview-actions .btn{
  width:100%;
  min-height:50px;
}
.outfit-wear-btn{
  font-size:16px;
  font-weight:800;
}
@media(min-width:600px){
  .outfit-preview-items{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}


.home-set-card{margin-bottom:14px}
.home-set-empty{padding:18px 8px;text-align:center;opacity:.58;font-size:13px}
.home-set-items{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px}
.home-set-item{flex:0 0 105px;text-align:center;font-size:12px;font-weight:700}
.home-set-item img{width:105px;height:120px;object-fit:cover;border-radius:14px;display:block;margin-bottom:6px}


.cute-home-set{overflow:hidden}
.cute-home-set-items{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;-webkit-overflow-scrolling:touch}
.cute-home-set-item{flex:0 0 145px;text-align:center}
.cute-home-set-photo{width:145px;height:175px;border-radius:18px;overflow:hidden;background:var(--card-bg);border:2px solid color-mix(in srgb,var(--accent-color) 28%,transparent);box-shadow:0 5px 16px rgba(0,0,0,.12)}
.cute-home-set-photo img{width:100%;height:100%;object-fit:cover;display:block}
.cute-home-set-name{margin-top:8px;font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cute-home-set-color{margin-top:3px;font-size:11px;opacity:.62}

.day-selection-screen{padding-bottom:24px}.selection-weather-advice{line-height:1.65}.day-selection-screen .choice-card{flex:0 0 128px}</style>
<script>
// 保存済みテーマを「最初の描画前」に適用。読み込み中だけデフォルト色になる問題を防止。
(()=>{const m={'night-secret':['#0D1A2F','#17364F','#09D8C7','#BD0927','#F3F4F6'],'backlight':['#E1D1CA','#AED8D6','#16939E','#FB958C','#50282C'],'glitter':['#201D39','#514575','#E58500','#FFC451','#F3F4F6'],'twilight':['#786181','#B05E76','#FB9C6C','#E97F83','#F3F4F6'],'fresh-sky':['#042C8F','#4891E7','#E8F957','#86D0FD','#FFFFFF'],'pastel-lagoon':['#E7F4EE','#F8FCF9','#59B7A6','#E77B9A','#29413D'],'crystal-shower':['#E8F1F4','#CBDDE3','#007FAF','#7189C4','#183746'],'sunset-citrus':['#0F3B59','#7D929E','#DBA12C','#3E251E','#DBD4CC']};const t=m[localStorage.getItem('my_closet_theme')]||m['sunset-citrus'];const r=document.documentElement;['--bg-primary','--bg-secondary','--accent-color','--accent-secondary','--text-main'].forEach((k,i)=>r.style.setProperty(k,t[i]));r.style.setProperty('--border-color',t[2]+'33')})();
</script>

<body class="min-h-screen pb-24 pt-16"><div class="app-version">ver.1.3</div>
<header class="fixed top-0 left-0 right-0 z-40 px-4 py-3 flex justify-between items-center backdrop-blur-md border-b border-white/10" style="background:var(--bg-primary)">
<div class="flex items-center gap-2"><i class="fa-solid fa-shirt text-xl theme-accent-text"></i><h1 class="font-bold text-lg">My Closet</h1></div>
<div class="flex gap-2"><button onclick="openFavorites()" class="w-9 h-9 rounded-full theme-card-bg text-rose-400"><i class="fa-solid fa-heart"></i></button><button onclick="openTheme()" class="px-3 py-1.5 rounded-full theme-card-bg text-xs"><i class="fa-solid fa-palette theme-accent-text mr-1"></i>テーマ</button></div>
</header>
<main id="app" class="px-4 max-w-md mx-auto"><div class="text-center py-10 opacity-60"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><div class="mt-2 text-xs">読み込み中...</div></div></main>
<nav class="fixed bottom-0 left-0 right-0 z-40 border-t border-white/10 backdrop-blur-lg py-2" style="background:var(--bg-primary)"><div class="max-w-md mx-auto grid grid-cols-5 text-center">
<button id="nav-today" onclick="switchTab('today')" class="py-1 text-gray-400"><i class="fa-solid fa-cloud-sun block mb-1"></i><span class="text-[10px]">コーデ</span></button>
<button id="nav-closet" onclick="switchTab('closet')" class="py-1 text-gray-400"><i class="fa-solid fa-door-closed block mb-1"></i><span class="text-[10px]">服一覧</span></button>
<button id="nav-laundry" onclick="switchTab('laundry')" class="py-1 text-gray-400 relative"><i class="fa-solid fa-soap block mb-1"></i><span class="text-[10px]">洗濯</span><b id="badge" class="hidden absolute top-0 right-3 bg-red-500 text-white rounded-full text-[9px] w-4 h-4">0</b></button>
<button id="nav-travel" onclick="switchTab('travel')" class="py-1 text-gray-400"><i class="fa-solid fa-suitcase block mb-1"></i><span class="text-[10px]">旅行</span></button>
<button id="nav-history" onclick="switchTab('history')" class="py-1 text-gray-400"><i class="fa-solid fa-calendar-days block mb-1"></i><span class="text-[10px]">履歴</span></button>
</div></nav>
<div id="overlay" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm p-4 items-center justify-center"><div id="modal" class="theme-card-bg rounded-2xl w-full max-w-sm p-5 modal-scroll"></div></div>
<script>
const CATS=[
{id:'tops',name:'トップス',icon:'fa-shirt',laundry:true},{id:'bottoms',name:'ボトムス',icon:'fa-user-nurse',laundry:true},{id:'dress',name:'ワンピース',icon:'fa-vest',laundry:true},{id:'outer',name:'ジャケット・アウター',icon:'fa-user-tie',laundry:false},{id:'socks',name:'靴下',icon:'fa-socks',laundry:true},{id:'shoes',name:'靴',icon:'fa-shoe-prints',laundry:false},{id:'acc',name:'アクセサリー',icon:'fa-gem',laundry:false}
];
const THEMES=[
{id:'night-secret',name:'ホログラム・シリウス',p:'#0D1A2F',s:'#17364F',a:'#09D8C7',x:'#BD0927',t:'#F3F4F6'},
{id:'backlight',name:'ティファニーで朝食を',p:'#E1D1CA',s:'#AED8D6',a:'#16939E',x:'#FB958C',t:'#50282C'},
{id:'glitter',name:'ランタンと魔法',p:'#201D39',s:'#514575',a:'#E58500',x:'#FFC451',t:'#F3F4F6'},
{id:'twilight',name:'薄明の空彩',p:'#786181',s:'#B05E76',a:'#FB9C6C',x:'#E97F83',t:'#F3F4F6'},
{id:'fresh-sky',name:'閃光都市',p:'#042C8F',s:'#4891E7',a:'#E8F957',x:'#86D0FD',t:'#FFFFFF'},
{id:'pastel-lagoon',name:'パステルラグーン',p:'#E7F4EE',s:'#F8FCF9',a:'#59B7A6',x:'#E77B9A',t:'#29413D'},
{id:'crystal-shower',name:'クリスタルシャワー',p:'#E8F1F4',s:'#CBDDE3',a:'#007FAF',x:'#7189C4',t:'#183746'},
{id:'sunset-citrus',name:'サンセットシトラス',p:'#0F3B59',s:'#7D929E',a:'#DBA12C',x:'#3E251E',t:'#DBD4CC'}];
let db=null,dbReady=null,currentTab='today',dayOffset=0,preview=false,themeId=localStorage.getItem('my_closet_theme')||'sunset-citrus';
const emptySel=()=>Object.fromEntries(CATS.map(c=>[c.id,[]]));
function selArray(v){return Array.isArray(v)?v:(v?[v]:[])}
function normalizeSelection(obj={}){return Object.fromEntries(CATS.map(c=>[c.id,selArray(obj[c.id])]))}
const selections={0:emptySel(),1:emptySel(),2:emptySel()};
const CLOTHING_COLORS=[
 {id:'white',name:'白',hex:'#F3F3EE'},{id:'black',name:'黒',hex:'#222222'},{id:'gray',name:'グレー',hex:'#8C9196'},
 {id:'beige',name:'ベージュ',hex:'#CDBB9B'},{id:'brown',name:'ブラウン',hex:'#795548'},{id:'navy',name:'ネイビー',hex:'#263B63'},
 {id:'blue',name:'ブルー',hex:'#4A90E2'},{id:'green',name:'グリーン',hex:'#5E9B72'},{id:'yellow',name:'イエロー',hex:'#E5C94A'},
 {id:'orange',name:'オレンジ',hex:'#E58A45'},{id:'red',name:'赤',hex:'#C95757'},{id:'pink',name:'ピンク',hex:'#D98CA0'},
 {id:'purple',name:'パープル',hex:'#8A6FAE'},{id:'other',name:'その他',hex:'#B9A7A0'}
];
let closetColorFilter='all';
const uid=()=>crypto?.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function currentSel(){return selections[dayOffset]}
function dateOffset(n=0){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
let storageMode='indexedDB';
const LS_PREFIX='my_closet_';
function lsKey(store){return LS_PREFIX+store}
function lsGet(store){try{return JSON.parse(localStorage.getItem(lsKey(store))||'[]')}catch(e){console.warn('localStorage read failed',e);return []}}
function lsPut(store,item){const a=lsGet(store),i=a.findIndex(x=>x.id===item.id);if(i>=0)a[i]=item;else a.push(item);localStorage.setItem(lsKey(store),JSON.stringify(a))}
function lsDel(store,id){const a=lsGet(store).filter(x=>x.id!==id);localStorage.setItem(lsKey(store),JSON.stringify(a))}
function initDB(){return new Promise(resolve=>{try{if(!window.indexedDB)throw new Error('IndexedDB unavailable');const r=indexedDB.open('MyClosetDB_v5',1);r.onupgradeneeded=e=>{const d=e.target.result;['clothes','saved_outfits','history','travels'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=e=>{db=e.target.result;db.onversionchange=()=>db.close();storageMode='indexedDB';resolve()};r.onerror=()=>{console.warn('IndexedDB unavailable, using localStorage',r.error);storageMode='localStorage';resolve()};r.onblocked=()=>{console.warn('IndexedDB blocked, using localStorage');storageMode='localStorage';resolve()}}catch(e){console.warn('IndexedDB unavailable, using localStorage',e);storageMode='localStorage';resolve()}})}
async function ready(){await dbReady;return db}
async function all(store){await ready();if(storageMode==='localStorage')return lsGet(store);return new Promise((resolve,reject)=>{try{const r=db.transaction(store,'readonly').objectStore(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error||new Error('読み込み失敗'))}catch(e){reject(e)}})}
async function put(store,item){await ready();if(storageMode==='localStorage'){lsPut(store,item);return}return new Promise((resolve,reject)=>{try{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('保存失敗'));tx.onabort=()=>reject(tx.error||new Error('保存中断'))}catch(e){reject(e)}})}
async function del(store,id){await ready();if(storageMode==='localStorage'){lsDel(store,id);return}return new Promise((resolve,reject)=>{try{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('削除失敗'))}catch(e){reject(e)}})}
function showModal(html){
const overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
if(!overlay||!modal)return; modal.innerHTML=html; overlay.classList.remove('hidden'); overlay.classList.add('flex');
}
let lastKnownAppDate=dateOffset(0);
setInterval(async()=>{
  const today=dateOffset(0);
  if(today===lastKnownAppDate)return;
  lastKnownAppDate=today;
  try{
    await render();
  }catch(e){
    console.error('date rollover failed',e);
  }
},60000);

function closeModal(){
const overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
if(!overlay||!modal)return; overlay.classList.add('hidden'); overlay.classList.remove('flex'); modal.innerHTML='';
}
function toast(msg){const x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function applyTheme(id){const t=THEMES.find(x=>x.id===id)||THEMES[0];themeId=t.id;localStorage.setItem('my_closet_theme',t.id);const r=document.documentElement;r.style.setProperty('--bg-primary',t.p);r.style.setProperty('--bg-secondary',t.s);r.style.setProperty('--accent-color',t.a);r.style.setProperty('--accent-secondary',t.x);r.style.setProperty('--text-main',t.t);r.style.setProperty('--border-color',t.a+'33')}
function openTheme(){
const dot=t=>`<span class="w-6 h-6 rounded-full border border-black/15 shadow-sm" style="background:${t}"></span>`;
showModal(`<h3 class="font-bold text-lg text-center mb-1">カラーテーマ</h3><p class="text-xs opacity-60 text-center mb-4">色の組み合わせをタップして変更</p><div class="space-y-2">${THEMES.map(t=>`<button onclick="applyTheme('${t.id}');openTheme()" class="w-full p-3 rounded-xl border flex items-center gap-3 ${themeId===t.id?'theme-accent-border border-2':'border-white/10'}" style="background:${t.s}"><div class="flex gap-1.5">${dot(t.p)}${dot(t.s)}${dot(t.a)}${dot(t.x)}${dot(t.t)}</div><span class="text-xs font-bold flex-1 text-left" style="color:${t.t}">${t.name}</span>${themeId===t.id?`<span class="font-bold" style="color:${t.a}">✓</span>`:''}</button>`).join('')}</div><button onclick="closeModal()" class="w-full mt-4 py-2.5 rounded-xl bg-white/10 text-xs font-bold">閉じる</button>`)
}
async function switchTab(tab){currentTab=tab;document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active-tab'));document.getElementById('nav-'+tab)?.classList.add('active-tab');await render()}
async function render(){
  await processHomeSetDayChange();try{if(currentTab==='today')await renderToday();if(currentTab==='closet')await renderCloset();if(currentTab==='laundry')await renderLaundry();if(currentTab==='travel')await renderTravel();if(currentTab==='history')await renderHistory();await badge()}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="py-10 text-center text-sm text-red-300">表示に失敗しました。再読み込みしてください。</div>'}}
function catName(id){return CATS.find(c=>c.id===id)?.name||''}
function itemLocked(i){return i.status==='laundry_wait'||i.status==='in_laundry'}
function orderedClothes(clothes,catId){return clothes.filter(x=>x.category===catId).sort((a,b)=>(a.order??999999)-(b.order??999999))}
async function renderToday(){
  const clothes=await all('clothes');

  if(preview){
    document.getElementById('app').innerHTML=previewHtml(clothes);
    return;
  }

  const days=['今日','明日','明後日'];
  const label=dayLabel(dayOffset);
  const hasSet=homeSetIds(dayOffset).length>0;

  document.getElementById('app').innerHTML=`
    <div id="weather" class="theme-card-bg rounded-2xl p-3 mb-4 text-xs text-center opacity-80">
      天気を取得中...
    </div>

    <div class="flex bg-black/20 rounded-xl p-1 mb-4">
      ${days.map((x,i)=>`
        <button
          type="button"
          onclick="changeDay(${i})"
          class="flex-1 py-2 rounded-lg text-xs font-bold ${i===dayOffset?'theme-accent-bg text-black':''}"
        >
          ${x}<br>
          <span class="text-[9px] opacity-60">${dateOffset(i)}</span>
        </button>
      `).join('')}
    </div>

    ${renderHomeSetCard(clothes)}

    <button
      type="button"
      onclick="openDayOutfitSelection()"
      class="w-full py-4 rounded-2xl theme-accent-bg text-black font-extrabold text-base mb-4"
    >
      ${hasSet ? label+'のコーデをセットしなおす' : label+'のコーデをセットする'}
    </button>
  `;

  fetchWeather();
}

async function changeDay(offset){
  dayOffset=offset;
  preview=false;
  await renderToday();
}

async function openDayOutfitSelection(){
  preview=false;
  const clothes=await all('clothes');
  const saved=getHomeSet(dayOffset);

  // 既にセット済みなら、その日のセット内容を最初から選択状態にする。
  selections[dayOffset]=saved ? normalizeSelection(saved.items) : emptySel();

  await renderDaySelection(clothes);
  fetchWeatherForSelection(dayOffset);
}

async function renderDaySelection(clothes){
  const label=dayLabel(dayOffset);
  const app=document.getElementById('app');
  if(!app)return;

  app.innerHTML=`
    <div class="day-selection-screen">
      <button type="button" onclick="renderToday()" class="text-sm opacity-75 mb-3">← 戻る</button>

      <div class="theme-card-bg rounded-2xl p-4 mb-4">
        <div class="font-extrabold mb-1">${label}の天気</div>
        <div id="selection-weather-main" class="text-sm font-bold opacity-80">天気を取得中...</div>

}

async function toggleSelect(cat,id){

  const a=selArray(s[cat]);

  const clothes=await all('clothes');
  await renderDaySelection(clothes);

function confirmPreview(){
  if(!hasCurrentSelection()){
    toast('服を1つ以上選択してください');
    return;
  }
  preview=true;
  renderToday();
}

function homeSetKey(offset){
  return 'my_closet_home_set_' + offset;
}

function getHomeSet(offset=dayOffset){
  try{
    const raw=localStorage.getItem(homeSetKey(offset));
    return raw?JSON.parse(raw):null;
  }catch(e){
    return null;
  }
}

function saveHomeSet(offset,items){
  localStorage.setItem(homeSetKey(offset),JSON.stringify({
    offset:offset,
    date:dateOffset(offset),
    items:normalizeSelection(items),
    setAt:Date.now()
  }));
}

function clearHomeSet(offset){
  localStorage.removeItem(homeSetKey(offset));
}

function homeSetIds(offset=dayOffset){
  const set=getHomeSet(offset);
  return set && set.date===dateOffset(offset)
    ? Object.values(set.items||{}).flatMap(selArray)
    : [];
}

async function processHomeSetDayChange(){
  for(let offset=0;offset<=2;offset++){
    const set=getHomeSet(offset);
    if(!set || set.date===dateOffset(offset))continue;

    const clothes=await all('clothes');
    const ids=Object.values(set.items||{}).flatMap(selArray);

    for(const id of ids){
      const item=clothes.find(x=>x.id===id);
      if(!item)continue;

      const cat=CATS.find(c=>c.id===item.category);
      if(cat && cat.laundry){
        item.status='laundry_wait';
        item.laundryStartTime=null;
        await put('clothes',item);
      }
    }

    clearHomeSet(offset);
  }
}

  const offset=dayOffset;
  const label=dayLabel(offset);
  const ids=homeSetIds(offset);
  const items=ids.map(id=>clothes.find(x=>x.id===id)).filter(Boolean);

  if(!items.length){

}

async function commitWear(){
  try{
    const selection=normalizeSelection(currentSel());
    const ids=Object.values(selection).flatMap(selArray);

    if(!ids.length){
      toast('服を1つ以上選択してください');
      return;
    }

    saveHomeSet(dayOffset,selection);

    await put('history',{
      id:uid(),
      date:dateOffset(dayOffset),
      items:selection,
      type:'set'
    });

    preview=false;
    await render();
    toast(dayLabel(dayOffset)+'のコーデをセットしました！');
  }catch(err){
    console.error(err);
    toast('コーデのセットに失敗しました');
  }

function startClothesLongPress(e,id,catId){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(e.target.closest('button,a,input,select,textarea'))return;
  const el=e.currentTarget||document.querySelector(`[data-drag-id="${id}"]`);
  const scroller=el?.closest('[data-drag-category]');
  if(!el||!scroller)return;

  if(dragState)cleanupClothesDrag();

  const state={
    id,catId,el,scroller,startX:e.clientX,startY:e.clientY,
    pointerId:e.pointerId,active:false,cancelled:false,timer:null,
    placeholder:null,lastTarget:null,lastBefore:null
  };
  dragState=state;
  el.classList.add('longpress-pending');

  // ホーム画面のアイコン移動に近い「少し長めの長押し」。
  state.timer=setTimeout(()=>activateClothesDrag(state),450);

  window.addEventListener('pointermove',onClothesLongPressMove,{passive:false});
  window.addEventListener('pointerup',endClothesDrag,{once:true});
  window.addEventListener('pointercancel',endClothesDrag,{once:true});

function activateClothesDrag(state){
  if(!dragState||dragState!==state||state.cancelled)return;

  state.active=true;
  state.el.classList.remove('longpress-pending');
  state.el.classList.add('dragging');

  // 元の位置を残すためのプレースホルダー。
  const ph=document.createElement('div');
  ph.className='drag-placeholder';
  ph.style.width=state.el.offsetWidth+'px';
  ph.style.height=state.el.offsetHeight+'px';
  ph.style.borderRadius=getComputedStyle(state.el).borderRadius;
  state.placeholder=ph;
  state.el.parentNode.insertBefore(ph,state.el);
  state.el.style.width=ph.style.width;
  state.el.style.height=ph.style.height;

  // 指の下にカードを追従させる。レイアウトはプレースホルダーで維持。
  state.el.style.position='fixed';
  state.el.style.zIndex='60';
  state.el.style.pointerEvents='none';
  state.el.style.left=(state.startX-state.el.offsetWidth/2)+'px';
  state.el.style.top=(state.startY-state.el.offsetHeight/2)+'px';
  state.el.style.margin='0';

  try{state.el.setPointerCapture?.(state.pointerId)}catch(_){}

}

function onClothesLongPressMove(e){
  const state=dragState;
  if(!state)return;

  const dx=e.clientX-state.startX,dy=e.clientY-state.startY;

  if(!state.active){
    // 少しでもスクロール方向へ動いたら長押しをキャンセル。
    if(Math.hypot(dx,dy)>10){
      state.cancelled=true;
      clearTimeout(state.timer);
      state.el.classList.remove('longpress-pending');
      cleanupClothesDrag();
    }
    return;
  }

  e.preventDefault();

  state.el.style.left=(e.clientX-state.el.offsetWidth/2)+'px';
  state.el.style.top=(e.clientY-state.el.offsetHeight/2)+'px';

  const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drag-id]');
  if(!target||target===state.el||!target.closest('[data-drag-category="'+state.catId+'"]'))return;

  const parent=target.parentElement;
  if(parent!==state.placeholder?.parentElement)return;

  const rect=target.getBoundingClientRect();
  const before=(e.clientX<rect.left+rect.width/2);
  const insertBefore=before?target:target.nextSibling;

  if(state.lastTarget===target&&state.lastBefore===before)return;
  state.lastTarget=target;
  state.lastBefore=before;

  if(insertBefore!==state.placeholder && insertBefore!==state.placeholder.nextSibling){
    parent.insertBefore(state.placeholder,insertBefore);
  }
}

function cleanupClothesDrag(){
  const state=dragState;
  if(!state)return;
  clearTimeout(state.timer);
  state.el.classList.remove('longpress-pending','dragging');

  if(state.active){
    state.el.style.position='';
    state.el.style.zIndex='';
    state.el.style.pointerEvents='';
    state.el.style.left='';
    state.el.style.top='';
    state.el.style.width='';
    state.el.style.height='';
    state.el.style.margin='';
  }

  state.placeholder?.remove();
  window.removeEventListener('pointermove',onClothesLongPressMove);
  window.removeEventListener('pointerup',endClothesDrag);
  window.removeEventListener('pointercancel',endClothesDrag);
  dragState=null;
}

async function endClothesDrag(){
  const state=dragState;
  if(!state)return;
  const wasActive=state.active;
  const parent=state.placeholder?.parentElement || state.el.parentElement;
  const placeholder=state.placeholder;

  clearTimeout(state.timer);
  window.removeEventListener('pointermove',onClothesLongPressMove);
  window.removeEventListener('pointerup',endClothesDrag);
  window.removeEventListener('pointercancel',endClothesDrag);

  if(!wasActive){
    state.el.classList.remove('longpress-pending');
    dragState=null;
    return;
  }

  // プレースホルダー位置へ戻してから保存。
  if(parent&&placeholder){
    parent.insertBefore(state.el,placeholder);
    placeholder.remove();
  }

  state.el.classList.remove('dragging');
  state.el.style.position='';
  state.el.style.zIndex='';
  state.el.style.pointerEvents='';
  state.el.style.left='';
  state.el.style.top='';
  state.el.style.width='';
  state.el.style.height='';
  state.el.style.margin='';
  dragState=null;

  const ids=[...parent.querySelectorAll('[data-drag-id]')].map(x=>x.dataset.dragId);
  const clothes=await all('clothes');
  let order=0;
  for(const id of ids){
    const item=clothes.find(x=>x.id===id);
    if(item){item.order=order++;await put('clothes',item)}
  }
  await render();
  toast('並び順を保存しました！');

async function fetchWeatherForSelection(offset=dayOffset){
  const main=document.getElementById('selection-weather-main');
  const advice=document.getElementById('selection-weather-advice');
  if(!main)return;

  const place=localStorage.getItem('my_closet_weather_place')||'伊勢原市';
  main.textContent='🌤 天気を取得中…';
  if(advice)advice.textContent='服装を考えています…';

  try{
    const geoRes=await fetch(
      `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(place)}&count=1&language=ja&format=json`
    );
    if(!geoRes.ok)throw new Error('geocoding request failed');

    const geo=await geoRes.json();
    const hit=geo.results?.[0];
    if(!hit)throw new Error('place not found');

    const url=`https://api.open-meteo.com/v1/forecast?latitude=${hit.latitude}&longitude=${hit.longitude}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_mean,weathercode&timezone=Asia%2FTokyo`;
    const res=await fetch(url);
    if(!res.ok)throw new Error('weather request failed');

    const data=await res.json();
    const w=data.daily;
    if(!w || w.temperature_2m_max?.[offset]==null || w.temperature_2m_min?.[offset]==null){
      throw new Error('weather data unavailable');
    }

    const max=Math.round(w.temperature_2m_max[offset]);
    const min=Math.round(w.temperature_2m_min[offset]);
    const rain=w.precipitation_probability_mean?.[offset] ?? 0;
    const code=w.weathercode?.[offset] ?? 0;

    let weatherText='晴れ';
    if(code>=95)weatherText='雷雨';
    else if(code>=80)weatherText='にわか雨';
    else if(code>=71)weatherText='雪';
    else if(code>=51)weatherText='雨';
    else if(code>=45)weatherText='霧';
    else if(code>=1)weatherText='曇り';

    main.innerHTML=`<span>🌤 ${weatherText}</span> ・ ${max}℃ / ${min}℃ ・ 降水 ${rain}%`;

    if(advice){
      const temp=(max+min)/2;
      let message;
      if(temp<8){
        message='今日はかなり寒くなるため、しっかりしたアウターを1枚もっていくといいでしょう。';
      }else if(temp<13){
        message='今日は肌寒い日になるため、薄めの上着を1枚もっていくといいでしょう。';
      }else if(temp<18){
        message='少しひんやりする日なので、軽い羽織りがあると安心です。';
      }else if(temp<23){
        message='朝晩は少し冷えるかもしれません。薄手の羽織りがあると安心です。';
      }else if(temp<28){
        message='過ごしやすい気温です。薄手で動きやすい服装がおすすめです。';
      }else if(temp<32){
        message='暑くなりそうなので、風通しのよい薄手の服がおすすめです。';
      }else{
        message='かなり暑くなりそうなので、できるだけ涼しく通気性のよい服装がおすすめです。';
      }
      advice.textContent=message;
    }
  }catch(e){
    console.error('Selection weather error:',e);
    main.textContent='天気を取得できませんでした';
    if(advice)advice.textContent='天気情報を確認できないため、気温に合わせて服装を選んでください。';
  }
}

async function fetchWeather(){const el=document.getElementById('weather');if(!el)return;const place=localStorage.getItem('my_closet_weather_place')||'伊勢原市';el.innerHTML=`<div class="flex items-center justify-between gap-3"><span>🌤 天気を取得中…</span><button onclick="setWeatherPlace()" class="px-2 py-1 rounded-lg bg-white/10 text-[10px]">${esc(place)}を変更</button></div>`;try{const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(place)}&count=1&language=ja&format=json`).then(r=>r.json());const hit=geo.results?.[0];if(!hit)throw new Error('place not found');const u=`https://api.open-meteo.com/v1/forecast?latitude=${hit.latitude}&longitude=${hit.longitude}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_mean,weathercode&timezone=Asia%2FTokyo`;const d=await fetch(u).then(r=>r.json());const w=d.daily,code=w.weathercode[dayOffset];let text=code>=51?'雨':code>=1?'曇り':'晴れ';el.innerHTML=`<div class="flex items-center justify-between gap-3"><div><div>🌤 ${text} ・ 降水 ${w.precipitation_probability_mean[dayOffset]||0}%</div><div class="text-[9px] opacity-50 mt-1">${esc(place)}</div></div><div class="text-right"><b>${Math.round(w.temperature_2m_max[dayOffset])}℃ / ${Math.round(w.temperature_2m_min[dayOffset])}℃</b><button onclick="setWeatherPlace()" class="block ml-auto mt-1 text-[9px] opacity-60">場所を変更</button></div></div>`}catch(e){el.innerHTML=`<div class="flex items-center justify-between gap-3"><span>天気を取得できませんでした</span><button onclick="setWeatherPlace()" class="px-2 py-1 rounded-lg bg-white/10 text-[10px]">場所を設定</button></div>`}}

dbReady=initDB();
window.addEventListener('DOMContentLoaded',async()=>{applyTheme(themeId);try{await dbReady;await checkLaundry();await switchTab('today')}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="text-center py-10 text-red-300 text-sm">データの読み込みに失敗しました。</div>'}setInterval(checkLaundry,60000)});
</script>
