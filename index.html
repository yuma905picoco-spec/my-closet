/* Completed outfit screen */
.outfit-preview-screen{
  min-height:calc(100vh - 180px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:24px;
  padding:12px 4px 28px;
}
.outfit-preview-items{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  align-items:start;
}
.outfit-preview-item{
  min-width:0;
  text-align:center;
}
.outfit-preview-photo{
  width:100%;
  aspect-ratio:1/1.12;
  border-radius:16px;
  overflow:hidden;
  background:var(--card-bg);
  border:1px solid color-mix(in srgb,var(--accent-color) 22%,transparent);
}
.outfit-preview-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.outfit-preview-name{
  margin-top:8px;
  font-weight:700;
  font-size:14px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.outfit-preview-color{
  margin-top:3px;
  font-size:12px;
  opacity:.7;
}
.outfit-preview-actions{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.outfit-preview-actions .btn{
  width:100%;
  min-height:50px;
}
.outfit-wear-btn{
  font-size:16px;
  font-weight:800;
}
@media(min-width:600px){
  .outfit-preview-items{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

.home-set-item{flex:0 0 105px;text-align:center;font-size:12px;font-weight:700}

<div class="header-actions flex gap-2"><button type="button" onclick="openFavorites()" aria-label="保存したコーデ" title="保存したコーデ" class="header-action-fav w-9 h-9 rounded-full theme-card-bg text-rose-400"><i class="fa-solid fa-heart"></i></button><button type="button" onclick="openTheme()" aria-label="テーマ" title="テーマ" class="header-action-theme px-3 py-1.5 rounded-full theme-card-bg text-xs"><i class="fa-solid fa-palette theme-accent-text mr-1"></i>テーマ</button></div>
</header>
<main id="app" class="px-4 max-w-md mx-auto"><div class="text-center py-10 opacity-60"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><div class="mt-2 text-xs">読み込み中...</div></div></main>
<nav class="fixed bottom-0 left-0 right-0 z-40 border-t border-white/10 backdrop-blur-lg py-2" style="background:var(--bg-primary)"><div class="max-w-md mx-auto grid grid-cols-5 text-center">
<button id="nav-today" onclick="switchTab('today')" class="py-1 text-gray-400"><i class="fa-solid fa-cloud-sun block mb-1"></i><span class="text-[10px]">コーデ</span></button>
<button id="nav-closet" onclick="switchTab('closet')" class="py-1 text-gray-400"><i class="fa-solid fa-door-closed block mb-1"></i><span class="text-[10px]">服一覧</span></button>
<button id="nav-laundry" onclick="switchTab('laundry')" class="py-1 text-gray-400 relative"><i class="fa-solid fa-soap block mb-1"></i><span class="text-[10px]">洗濯</span><b id="badge" class="hidden absolute top-0 right-3 bg-red-500 text-white rounded-full text-[9px] w-4 h-4">0</b></button>
<button id="nav-travel" onclick="switchTab('travel')" class="py-1 text-gray-400"><i class="fa-solid fa-suitcase block mb-1"></i><span class="text-[10px]">旅行</span></button>
<button id="nav-history" onclick="switchTab('history')" class="py-1 text-gray-400"><i class="fa-solid fa-calendar-days block mb-1"></i><span class="text-[10px]">履歴</span></button>
</div></nav>
<div id="overlay" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm p-4 items-center justify-center"><div id="modal" class="theme-card-bg rounded-2xl w-full max-w-sm p-5 modal-scroll"></div></div>
<script>
const CATS=[
{id:'tops',name:'トップス',icon:'fa-shirt',laundry:true},{id:'bottoms',name:'ボトムス',icon:'fa-user-nurse',laundry:true},{id:'dress',name:'ワンピース',icon:'fa-vest',laundry:true},{id:'outer',name:'ジャケット・アウター',icon:'fa-user-tie',laundry:false},{id:'socks',name:'靴下',icon:'fa-socks',laundry:true},{id:'shoes',name:'靴',icon:'fa-shoe-prints',laundry:false},{id:'acc',name:'アクセサリー',icon:'fa-gem',laundry:false}
];
const THEMES=[
{id:'sunset-citrus',texture:'terracotta',finish:'matte',family:'terracotta',design:'sculptural',name:'サンセット・テラコッタ',p:'#D9C3A5',s:'#F4E9D8',a:'#C8794B',x:'#8DA79A',t:'#43352C'},
{id:'night-secret',texture:'glass',finish:'liquid',family:'glass',design:'glass',name:'ホログラム・グラス',p:'#0D1A2F',s:'#17364F',a:'#09D8C7',x:'#BD0927',t:'#F3F4F6'},
{id:'backlight',texture:'crayon',finish:'soft',family:'crayon',design:'soft',name:'ティファニー・クレヨン',p:'#E1D1CA',s:'#FFF8EC',a:'#6BA9A7',x:'#F4A69B',t:'#423A39'},
{id:'glitter',texture:'terracotta',finish:'matte',family:'terracotta',design:'sculptural',name:'ランタン・テラコッタ',p:'#E9C48D',s:'#F8EAD0',a:'#B96B36',x:'#6C503B',t:'#392B25'},
{id:'twilight',texture:'crayon',finish:'soft',family:'crayon',design:'soft',name:'薄明・クレヨン',p:'#E7D5DD',s:'#FFF7F0',a:'#B88BA8',x:'#F1A18B',t:'#4D3B4B'},
{id:'fresh-sky',texture:'glass',finish:'chrome',family:'glass',design:'glass',name:'閃光都市・グラス',p:'#071A2A',s:'#173D59',a:'#B6F04A',x:'#72D9F2',t:'#F4FAFF'},
{id:'pastel-lagoon',texture:'terracotta',finish:'matte',family:'terracotta',design:'sculptural',name:'セージ・テラコッタ',p:'#C9D6C7',s:'#F3F0E6',a:'#719B8A',x:'#D9A078',t:'#33463D'},
{id:'crystal-shower',texture:'glass',finish:'ice',family:'glass',design:'glass',name:'オーシャン・グラス',p:'#B8DDE5',s:'#F1FAFC',a:'#2586A4',x:'#7ED8D0',t:'#183746'},
{id:'iridescent-lavender',texture:'glass',finish:'frost',family:'glass',design:'glass',name:'イリディセント・グラス',p:'#B7A0D4',s:'#F8F4FC',a:'#8D62E8',x:'#F09BD9',t:'#35284A'},
{id:'iridescent-ocean',texture:'glass',finish:'crystal',family:'glass',design:'glass',name:'オーシャン・クリスタル・グラス',p:'#8EBAD4',s:'#F1FAFC',a:'#4B8FD8',x:'#83DCD0',t:'#243C54'},
{id:'iridescent-peach',texture:'crayon',finish:'soft',family:'crayon',design:'soft',name:'ピーチ・クレヨン',p:'#E8B7C8',s:'#FFF7F1',a:'#E783B7',x:'#F4C36B',t:'#57364D'},
{id:'iridescent-mint',texture:'terracotta',finish:'matte',family:'terracotta',design:'sculptural',name:'ミント・テラコッタ',p:'#A5D5C9',s:'#F3FBF8',a:'#54AE9A',x:'#B8A0EA',t:'#294B49'},
{id:'iridescent-midnight',texture:'glass',finish:'liquid',family:'glass',design:'glass',name:'ミッドナイト・グラス',p:'#302747',s:'#51416E',a:'#B59AF7',x:'#ED91D3',t:'#FBF7FF'},
{id:'nothing-white',texture:'mono',finish:'flat',family:'nothing',design:'mono',name:'NOTHING / WHITE',p:'#F4F4EF',s:'#FFFFFF',a:'#181818',x:'#B7B7AE',t:'#171717'},
{id:'nothing-black',texture:'mono',finish:'flat',family:'nothing',design:'mono',name:'NOTHING / BLACK',p:'#111312',s:'#242725',a:'#F3F3EE',x:'#777D76',t:'#F3F3EE'},
{id:'famicom-classic',texture:'pixel',finish:'pixel',family:'famicom',design:'pixel',name:'ファミコン・クラシック',p:'#6C6B4D',s:'#D8D5AD',a:'#A64B3D',x:'#34382A',t:'#22251B'},
{id:'8bit-green',texture:'pixel',finish:'pixel',family:'famicom',design:'pixel',name:'8BIT・グリーン',p:'#263B2B',s:'#526B45',a:'#B8C96D',x:'#D9D2A0',t:'#E5E8C8'},
{id:'dot-sunset',texture:'pixel',finish:'pixel',family:'famicom',design:'pixel',name:'ドット・サンセット',p:'#653D37',s:'#D9B98B',a:'#D56C45',x:'#394D59',t:'#F7E7C5'},
{id:'cherry-pixel',texture:'pixel',finish:'pixel-soft',family:'pixelrevival',design:'pixel-soft',name:'チェリー・ピクセル',p:'#F2A0A7',s:'#C0E0C8',a:'#D86E83',x:'#F8E9C7',t:'#314B49'},
{id:'mint-desktop',texture:'pixel',finish:'pixel-soft',family:'pixelrevival',design:'pixel-soft',name:'ミント・デスクトップ',p:'#A8D8C8',s:'#F3EFD6',a:'#477D7C',x:'#E99AA4',t:'#304846'},
{id:'pixel-dream',texture:'pixel',finish:'pixel-soft',family:'pixelrevival',design:'pixel-soft',name:'ピクセル・ドリーム',p:'#C9B5E8',s:'#F8E4E6',a:'#8A7FC0',x:'#8DCBCB',t:'#413650'}];
let db=null,dbReady=null,currentTab='today',dayOffset=0,preview=false,themeId=localStorage.getItem('my_closet_theme')||'sunset-citrus',draftThemeId=themeId;
let historyView='history', analysisPeriod='month', analysisCategory='tops';
const emptySel=()=>Object.fromEntries(CATS.map(c=>[c.id,[]]));
function selArray(v){return Array.isArray(v)?v:(v?[v]:[])}
function normalizeSelection(obj={}){return Object.fromEntries(CATS.map(c=>[c.id,selArray(obj[c.id])]))}
const selections={0:emptySel(),1:emptySel(),2:emptySel()};
const CLOTHING_COLORS=[
 {id:'white',name:'白',hex:'#F3F3EE'},{id:'black',name:'黒',hex:'#222222'},{id:'gray',name:'グレー',hex:'#8C9196'},
 {id:'beige',name:'ベージュ',hex:'#CDBB9B'},{id:'brown',name:'ブラウン',hex:'#795548'},{id:'navy',name:'ネイビー',hex:'#263B63'},
 {id:'blue',name:'ブルー',hex:'#4A90E2'},{id:'green',name:'グリーン',hex:'#5E9B72'},{id:'yellow',name:'イエロー',hex:'#E5C94A'},
 {id:'orange',name:'オレンジ',hex:'#E58A45'},{id:'red',name:'赤',hex:'#C95757'},{id:'pink',name:'ピンク',hex:'#D98CA0'},
 {id:'purple',name:'パープル',hex:'#8A6FAE'},{id:'other',name:'その他',hex:'#B9A7A0'}
];
let closetColorFilter='all'; let closetScrollOffsets={}; let closetColorScrollOffset=0;
function colorIds(item){
  if(Array.isArray(item?.color)) return item.color;
  if(item?.colors && Array.isArray(item.colors)) return item.colors;
  return item?.color ? [item.color] : ['other'];
}
function colorNames(item){
  return colorIds(item).map(id=>CLOTHING_COLORS.find(c=>c.id===id)?.name||id).join(' / ');
}
function hasColor(item,colorId){ return colorId==='all' || colorIds(item).includes(colorId); }

const uid=()=>crypto?.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function currentSel(){return selections[dayOffset]}
function dateOffset(n=0){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
let storageMode='indexedDB';
const LS_PREFIX='my_closet_';
function lsKey(store){return LS_PREFIX+store}
function lsGet(store){try{return JSON.parse(localStorage.getItem(lsKey(store))||'[]')}catch(e){console.warn('localStorage read failed',e);return []}}
function lsPut(store,item){const a=lsGet(store),i=a.findIndex(x=>x.id===item.id);if(i>=0)a[i]=item;else a.push(item);localStorage.setItem(lsKey(store),JSON.stringify(a))}
function lsDel(store,id){const a=lsGet(store).filter(x=>x.id!==id);localStorage.setItem(lsKey(store),JSON.stringify(a))}
function initDB(){return new Promise(resolve=>{try{if(!window.indexedDB)throw new Error('IndexedDB unavailable');const r=indexedDB.open('MyClosetDB_v5',1);r.onupgradeneeded=e=>{const d=e.target.result;['clothes','saved_outfits','history','travels'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=e=>{db=e.target.result;db.onversionchange=()=>db.close();storageMode='indexedDB';resolve()};r.onerror=()=>{console.warn('IndexedDB unavailable, using localStorage',r.error);storageMode='localStorage';resolve()};r.onblocked=()=>{console.warn('IndexedDB blocked, using localStorage');storageMode='localStorage';resolve()}}catch(e){console.warn('IndexedDB unavailable, using localStorage',e);storageMode='localStorage';resolve()}})}
async function ready(){await dbReady;return db}
async function all(store){await ready();if(storageMode==='localStorage')return lsGet(store);return new Promise((resolve,reject)=>{try{const r=db.transaction(store,'readonly').objectStore(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error||new Error('読み込み失敗'))}catch(e){reject(e)}})}
async function put(store,item){await ready();if(storageMode==='localStorage'){lsPut(store,item);return}return new Promise((resolve,reject)=>{try{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('保存失敗'));tx.onabort=()=>reject(tx.error||new Error('保存中断'))}catch(e){reject(e)}})}
async function del(store,id){await ready();if(storageMode==='localStorage'){lsDel(store,id);return}return new Promise((resolve,reject)=>{try{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('削除失敗'))}catch(e){reject(e)}})}
function showModal(html){
const overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
if(!overlay||!modal)return; modal.innerHTML=html; overlay.classList.remove('hidden'); overlay.classList.add('flex');
}
let lastKnownAppDate=dateOffset(0);
setInterval(async()=>{
  const today=dateOffset(0);
  if(today===lastKnownAppDate)return;
  lastKnownAppDate=today;
  try{
    await render();
  }catch(e){
    console.error('date rollover failed',e);
  }
},60000);

function closeModal(){
const overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
if(!overlay||!modal)return; overlay.classList.add('hidden'); overlay.classList.remove('flex'); modal.innerHTML='';
}
function toast(msg){const x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function applyTheme(id){const t=THEMES.find(x=>x.id===id)||THEMES[0];themeId=t.id;localStorage.setItem('my_closet_theme',t.id);const r=document.documentElement;r.dataset.theme=t.id;r.dataset.texture=t.texture||'glass';r.dataset.finish=t.finish||'frost';r.dataset.design=t.design||'glass';r.dataset.family=t.family||'glass';r.style.setProperty('--bg-primary',t.p);r.style.setProperty('--bg-secondary',t.s);r.style.setProperty('--accent-color',t.a);r.style.setProperty('--accent-secondary',t.x);r.style.setProperty('--text-main',t.t);r.style.setProperty('--border-color',t.a+'33')}
function getOwnerName(){return (localStorage.getItem('my_closet_owner_name')||'').replace(/[^a-zA-Z]/g,'').slice(0,24)}
function updateAppTitle(){const name=getOwnerName();const title=name?`${name}'s Closet`:'My Closet';const h=document.getElementById('app-title');if(h)h.textContent=title;document.title=title;const appTitle=document.querySelector('meta[name="apple-mobile-web-app-title"]');if(appTitle)appTitle.setAttribute('content',title)}
function saveOwnerName(){const input=document.getElementById('closet-owner-name');if(!input)return;const name=input.value.replace(/[^a-zA-Z]/g,'').slice(0,24);if(name)localStorage.setItem('my_closet_owner_name',name);else localStorage.removeItem('my_closet_owner_name');input.value=name;updateAppTitle();toast(name?`表示名を${name}に変更しました`:'表示名をMy Closetに戻しました')}
function openTheme(){
 const families=[
 {id:'glass',name:'01 / GLASS',jp:'光・透明感・奥行き',desc:'透ける層、反射、液体のような艶',ids:THEMES.filter(t=>t.family==='glass')},
 {id:'terracotta',name:'02 / TERRACOTTA',jp:'マット・彫刻的',desc:'陶器のような表面、柔らかな影、立体感',ids:THEMES.filter(t=>t.family==='terracotta')},
 {id:'crayon',name:'03 / CRAYON',jp:'温かさ・パステル',desc:'柔らかな紙やクレヨンを思わせる色彩',ids:THEMES.filter(t=>t.family==='crayon')},
 {id:'nothing',name:'04 / NOTHING',jp:'モノクロ・機能美',desc:'白黒、ドット、罫線を活かしたミニマルUI',ids:THEMES.filter(t=>t.family==='nothing')},
 {id:'famicom',name:'05 / FAMICOM',jp:'8-bit・クラシックゲーム',desc:'限られた色数と角ばったピクセル',ids:THEMES.filter(t=>t.family==='famicom')},
 {id:'pixelrevival',name:'06 / PIXEL REVIVAL',jp:'レトロPC・現代的ドット',desc:'ウィンドウ、格子、パステルカラー',ids:THEMES.filter(t=>t.family==='pixelrevival')}];
 const dot=c=>`<span class="w-5 h-5 rounded-full border border-black/15 shadow-sm" style="background:${c}"></span>`;
 const current=THEMES.find(t=>t.id===draftThemeId)||THEMES.find(t=>t.id===themeId)||THEMES[0];
 const art=t=>`<div class="theme-preset-art art-${t.design}" style="--swatch-a:${t.p};--swatch-b:${t.s};--swatch-c:${t.a};--swatch-d:${t.x}"><span></span><span></span><span></span><b>MY CLOSET</b></div>`;
 const familyCards=families.map(f=>`<section class="theme-family-section theme-group-${f.id}"><div class="flex items-start justify-between mb-3"><div><div class="font-bold text-sm">${f.name}</div><div class="text-[10px] opacity-75 mt-1">${f.jp}</div><div class="text-[10px] opacity-55 mt-1">${f.desc}</div></div><span class="text-xs opacity-50">${String(f.ids.length).padStart(2,'0')} THEMES</span></div><div class="theme-preset-grid">${f.ids.map(t=>`<button type="button" onclick="selectDraftTheme('${t.id}')" class="theme-preset-card ${draftThemeId===t.id?'theme-preset-selected':''}">${art(t)}<div class="p-2 text-left"><div class="text-[11px] font-bold leading-snug">${t.name}</div><div class="flex gap-1 mt-2">${dot(t.p)}${dot(t.s)}${dot(t.a)}${dot(t.x)}</div></div>${draftThemeId===t.id?'<span class="theme-preset-check">✓</span>':''}</button>`).join('')}</div></section>`).join('');
 showModal(`<div class="theme-studio"><div class="theme-studio-toolbar"><div><div class="text-[10px] tracking-[.18em] opacity-55">MY CLOSET / THEMES</div><h3 class="font-bold text-lg mt-1">テーマを選択</h3></div><div class="theme-studio-actions"><button type="button" class="theme-studio-action theme-studio-action-close" onclick="cancelThemeSelection()" aria-label="閉じる" title="閉じる"><i class="fa-solid fa-xmark"></i></button><button type="button" class="theme-studio-action theme-studio-action-confirm" onclick="confirmThemeSelection()" aria-label="決定" title="決定"><i class="fa-solid fa-check"></i></button></div></div><div class="theme-studio-intro"><div class="text-[10px] rounded-full px-2 py-1 theme-card-bg inline-flex mb-2">選択中：<span id="theme-draft-name" class="font-bold ml-1">${current.name}</span></div><p class="text-xs opacity-65 mb-4 leading-relaxed">好きな世界観を選んで、右上の ✓ で決定。テーマを変更しても登録データはそのまま保存されます。</p></div><section class="theme-card-bg rounded-xl p-3 mb-4"><label for="closet-owner-name" class="block text-sm font-bold mb-1">表示する名前</label><p class="text-xs opacity-70 mb-2">上のバーを「名前's Closet」に変更できます（ローマ字 A〜Z のみ）。</p><div class="flex gap-2"><input id="closet-owner-name" type="text" value="${esc(getOwnerName())}" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例：Namae" class="min-w-0 flex-1 rounded-lg px-3 py-2 text-sm border bg-black/10" oninput="this.value=this.value.replace(/[^a-zA-Z]/g,'')"><button type="button" onclick="saveOwnerName()" class="theme-accent-bg rounded-lg px-4 py-2 text-sm font-bold">保存</button></div><p class="text-[10px] opacity-60 mt-2">空欄にすると「My Closet」に戻ります。</p></section><div class="space-y-4">${familyCards}</div></div>`);
}
function selectDraftTheme(id){draftThemeId=id;openTheme()}
function confirmThemeSelection(){applyTheme(draftThemeId);closeModal();toast('テーマを変更しました')}
function cancelThemeSelection(){draftThemeId=themeId;closeModal()}
async function switchTab(tab){currentTab=tab;document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active-tab'));document.getElementById('nav-'+tab)?.classList.add('active-tab');await render()}
async function render(){
  await processHomeSetDayChange();try{if(currentTab==='today')await renderToday();if(currentTab==='closet')await renderCloset();if(currentTab==='laundry')await renderLaundry();if(currentTab==='travel')await renderTravel();if(currentTab==='history')await renderHistory();await badge()}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="py-10 text-center text-sm text-red-300">表示に失敗しました。再読み込みしてください。</div>'}}
function catName(id){return CATS.find(c=>c.id===id)?.name||''}
function itemLocked(i){return i.status==='laundry_wait'||i.status==='in_laundry'}
function orderedClothes(clothes,catId){return clothes.filter(x=>x.category===catId).sort((a,b)=>(a.order??999999)-(b.order??999999))}
async function renderToday(){
  const clothes=await all('clothes');

  if(preview){
    document.getElementById('app').innerHTML=previewHtml(clothes);
    return;
  }

  const days=['今日','明日','明後日'];
  const label=dayLabel(dayOffset);
  const hasSet=homeSetIds(dayOffset).length>0;

  document.getElementById('app').innerHTML=`
    <div id="weather" class="theme-card-bg rounded-2xl p-3 mb-4 text-xs text-center opacity-80">
      天気を取得中...
    </div>

    <div class="flex bg-black/20 rounded-xl p-1 mb-4">
      ${days.map((x,i)=>`
        <button
          type="button"
          onclick="changeDay(${i})"
          class="flex-1 py-2 rounded-lg text-xs font-bold ${i===dayOffset?'theme-accent-bg text-black':''}"
        >
          ${x}<br>
          <span class="text-[9px] opacity-60">${dateOffset(i)}</span>
        </button>
      `).join('')}
    </div>

    ${renderHomeSetCard(clothes)}

    <button
      type="button"
      onclick="openDayOutfitSelection()"
      class="w-full py-4 rounded-2xl theme-accent-bg text-black font-extrabold text-base mb-4"
    >
      ${hasSet ? label+'のコーデをセットしなおす' : label+'のコーデをセットする'}
    </button>
    <button type="button" onclick="openOutfitAdvisor()" class="w-full py-3 rounded-2xl theme-card-bg font-bold text-sm mb-4">✨ 手持ち服からコーデを提案</button>
  `;

  fetchWeather();
}

async function changeDay(offset){
  dayOffset=offset;
  preview=false;
  await renderToday();
}

async function openDayOutfitSelection(){
  preview=false;
  const clothes=await all('clothes');
  const saved=getHomeSet(dayOffset);

  // 既にセット済みなら、その日のセット内容を最初から選択状態にする。
  selections[dayOffset]=saved ? normalizeSelection(saved.items) : emptySel();

  await renderDaySelection(clothes);
  fetchWeatherForSelection(dayOffset);
}

async function renderDaySelection(clothes){
  const scrollPositions={};
  document.querySelectorAll('.day-selection-screen .choice-row').forEach((el,index)=>{
    const key=el.dataset.scrollKey||`row-${index}`;
    scrollPositions[key]=el.scrollLeft;
  });
  const label=dayLabel(dayOffset);
  const app=document.getElementById('app');
  if(!app)return;

  app.innerHTML=`
    <div class="day-selection-screen">

function saveHomeSet(offset,items){

async function processHomeSetDayChange(){
  // Home-set keys are relative offsets (today/tomorrow/day after tomorrow),
  // but the saved date is absolute. After midnight, shift still-valid plans
  // to their new offsets and only send genuinely past outfits to laundry.
  const today=dateOffset(0);
  const sets=[];
  for(let offset=0;offset<=2;offset++){
    const set=getHomeSet(offset);
    if(set && set.date && set.items) sets.push({...set, previousOffset:offset});
  }
  if(!sets.length)return;

  const expired=sets.filter(set=>set.date<today);
  const active=sets.filter(set=>set.date>=today && set.date<=dateOffset(2));
  const activeIds=new Set(active.flatMap(set=>Object.values(set.items||{}).flatMap(selArray)));

  // First clear the old relative keys, then restore valid plans using the
  // number of calendar days between their saved date and today.
  for(let offset=0;offset<=2;offset++) clearHomeSet(offset);

  const clothes=await all('clothes');
  const expiredIds=new Set(expired.flatMap(set=>Object.values(set.items||{}).flatMap(selArray)));
  for(const id of expiredIds){
    // If an item is planned for today or a future day, keep it available.
    if(activeIds.has(id))continue;
    const item=clothes.find(x=>x.id===id);
    if(!item)continue;
    const cat=CATS.find(c=>c.id===item.category);
    if(cat && cat.laundry){
      item.status='laundry_wait';
      item.laundryStartTime=null;
      await put('clothes',item);
    }
  }

  for(const set of active){
    const diff=Math.round((new Date(set.date+'T12:00:00')-new Date(today+'T12:00:00'))/86400000);
    if(diff<0 || diff>2)continue;
    localStorage.setItem(homeSetKey(diff),JSON.stringify({offset:diff,date:set.date,items:normalizeSelection(set.items),setAt:set.setAt||Date.now()}));
  }
}

async function commitWear(){
  try{
    const selection=normalizeSelection(currentSel());
    const ids=Object.values(selection).flatMap(selArray);

    if(!ids.length){
      toast('服を1つ以上選択してください');
      return;
    }

    saveHomeSet(dayOffset,selection);

    // Only today's outfit is reflected in wear history. Future outfits are plans,
    // not confirmed wear records. Re-setting today's outfit replaces today's entry.
    if(dayOffset===0){
      const today=dateOffset(0);
      const todaysHistory=(await all('history')).filter(h=>h.date===today);
      if(todaysHistory.length){
        // Keep the existing ID so an already-favorited history outfit stays linked.
        const keep=todaysHistory[todaysHistory.length-1];
        await put('history',{...keep,date:today,items:selection,type:'set'});
        // Older builds could create multiple entries for one day; collapse them.
        for(const duplicate of todaysHistory){
          if(duplicate.id!==keep.id) await del('history',duplicate.id);
        }
      }else{
        await put('history',{id:uid(),date:today,items:selection,type:'set'});
      }
    }

    preview=false;
    await render();
    toast(dayLabel(dayOffset)+'のコーデをセットしました！');
  }catch(err){
    console.error(err);
    toast('コーデのセットに失敗しました');
  }
}

async function compress(file){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const max=1200,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));if(!blob)throw new Error('compress');return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}finally{URL.revokeObjectURL(url)}}

 target.classList.toggle('selected-color',next);

 target.style.transform=next?'scale(1.08)':'';
}

function startClothesDrag(e,id,catId){

  placeholder.style.height=rect.height+'px';

function moveDraggedPlaceholderToPointer(state){

  const after=state.lastX>rect.left+rect.width/2;

function dragAutoScrollLoop(){

      const strength=Math.min(1,Math.max(0,(x-(r.right-edge))/edge));

function periodStart(period){

 if(period==='week'){const day=(now.getDay()+6)%7;now.setDate(now.getDate()-day);return localDateString(now)}
 if(period==='month')return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
 if(period==='3months'){now.setMonth(now.getMonth()-2);now.setDate(1);return localDateString(now)}
 if(period==='year')return `${now.getFullYear()}-01-01`;
 return '0000-01-01';
}

 const ranking=items.length?items.map((c,i)=>`<div class="theme-card-bg rounded-2xl p-3 flex items-center gap-3 mb-2"><div class="text-xl font-black theme-accent-text w-7 text-center">${i+1}</div><div class="w-20 h-24 rounded-xl overflow-hidden bg-black/20 flex-shrink-0">${c.image?`<img src="${c.image}" class="w-full h-full object-cover" alt="${esc(c.name)}">`:'<div class="w-full h-full flex items-center justify-center opacity-40 text-3xl">👕</div>'}</div><div class="flex-1 min-w-0"><div class="text-xs font-bold break-words">${esc(c.name)}</div><div class="text-[10px] opacity-50 mt-1">${esc(catName(c.category))}</div><div class="text-sm font-black theme-accent-text mt-2">${c.count}回 <span class="text-[10px] font-normal opacity-60">着用</span></div></div></div>`).join(''):'<div class="text-center text-xs opacity-50 py-8 theme-card-bg rounded-2xl">この期間の着用データはありません</div>';

 let acc=0;const slices=Object.entries(colorCounts).sort((a,b)=>b[1]-a[1]).map(([id,n])=>{const c=CLOTHING_COLORS.find(x=>x.id===id)||CLOTHING_COLORS.find(x=>x.id==='other');const from=acc;acc+=n/Math.max(total,1)*100;return {id,n,c,from,to:acc}});
 const gradient=slices.length?`conic-gradient(${slices.map(x=>`${x.c.hex} ${x.from}% ${x.to}%`).join(',')})`:'conic-gradient(#ffffff22 0% 100%)';
 const chart=`<div class="theme-card-bg rounded-2xl p-4 mb-4"><div class="font-bold text-xs mb-1">🎨 着用カラーの割合</div><div class="text-[10px] opacity-50 mb-3">${periodLabel(analysisPeriod)}・履歴に記録された服を集計</div><div class="flex items-center gap-4"><div style="width:132px;height:132px;border-radius:50%;background:${gradient};position:relative;flex-shrink:0"><div style="position:absolute;inset:29px;border-radius:50%;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;flex-direction:column"><b class="text-lg">${Math.round(total)}</b><span class="text-[9px] opacity-60">アイテム分</span></div></div><div class="flex-1 min-w-0 space-y-2">${slices.length?slices.map(x=>`<div class="flex items-center gap-2 text-[10px]"><span style="width:10px;height:10px;border-radius:3px;background:${x.c.hex};display:inline-block;flex-shrink:0"></span><span class="flex-1">${esc(x.c.name)}</span><b>${Math.round(x.n/total*100)}%</b></div>`).join(''):'<div class="text-[10px] opacity-50">着用データがありません</div>'}</div></div></div>`;

// Free, on-device outfit adviser: no external AI key or paid API required.
function outfitWords(item){return `${item.name||''} ${item.description||''}`.toLowerCase()}
function itemHas(item,words){const t=outfitWords(item);return words.some(w=>t.includes(w))}
function outfitColorScore(a,b){
 const ca=colorIds(a),cb=colorIds(b);let score=0;
 const neutrals=['white','black','gray','beige','brown','navy'];
 for(const x of ca)for(const y of cb){
  if(x===y)score=Math.max(score,3);
  else if(neutrals.includes(x)&&neutrals.includes(y))score=Math.max(score,3);
  else if(neutrals.includes(x)||neutrals.includes(y))score=Math.max(score,4);
  else if((x==='blue'&&['brown','beige','orange'].includes(y))||(y==='blue'&&['brown','beige','orange'].includes(x))||(x==='green'&&['beige','brown'].includes(y))||(y==='green'&&['beige','brown'].includes(x)))score=Math.max(score,3);
  else score=Math.max(score,1);
 }
 return score;
}
function outfitStyleScore(items,style){
 const allText=items.map(outfitWords).join(' ');const map={
 'きれいめ':['きれいめ','上品','サテン','ブラウス','スラックス','コンパクト','ジャケット','光沢'],
 'カジュアル':['カジュアル','デニム','スウェット','tシャツ','ゆったり','ラフ','スニーカー'],
 'モード':['モード','モノトーン','黒','シルエット','ワイド','レザー','シャープ'],
 '大人っぽい':['大人','落ち着','上品','シンプル','ベーシック','ネイビー','ブラウン']};
 return (map[style]||[]).reduce((n,w)=>n+(allText.includes(w)?1:0),0);
}
function buildOutfitSuggestions(clothes,style,focus,weather){
 const available=clothes.filter(i=>i.status==='closet');
 const cat=id=>available.filter(i=>i.category===id);
 let combos=[];
 const tops=cat('tops'),bottoms=cat('bottoms'),dresses=cat('dress');
 for(const t of tops)for(const b of bottoms)combos.push([t,b]);
 for(const d of dresses)combos.push([d]);
 // Keep the search bounded for large wardrobes while retaining variety.
 combos=combos.slice(0,2500).map(items=>{
  const outer=cat('outer').filter(x=>!focus||focus==='指定なし'||(focus==='アウター'&&x.category==='outer')).sort((a,b)=>outfitStyleScore([b],style)-outfitStyleScore([a],style))[0];
  const shoes=cat('shoes')[0];
  const result=[...items];
  if(outer && (weather?.min<18 || itemHas(outer,['薄手','軽い','春','秋','冬','暖か'])))result.push(outer);
  if(shoes)result.push(shoes);
  const base=items.reduce((n,x,i)=>n+(i?outfitColorScore(items[0],x):0),0);
  let score=base+outfitStyleScore(result,style)*1.6;
  const text=result.map(outfitWords).join(' ');
  if(weather){if(weather.max>=27&&/厚手|冬|ウール|ダウン/.test(text))score-=3;if(weather.min<=12&&/薄手|夏|リネン|半袖/.test(text))score-=2;if(weather.rain>=50&&result.some(x=>itemHas(x,['スエード','雨に弱い','濡れやすい'])))score-=2;}
  if(focus==='トップス'&&!items.some(x=>x.category==='tops'))score-=5;
  if(focus==='ボトムス'&&!items.some(x=>x.category==='bottoms'))score-=5;
  if(focus==='アウター'&&!result.some(x=>x.category==='outer'))score-=5;
  return {items:result,score};
 });
 const seen=new Set();return combos.sort((a,b)=>b.score-a.score).filter(c=>{const k=c.items.map(i=>i.id).join('|');if(seen.has(k))return false;seen.add(k);return true}).slice(0,5);
}

 showModal(`<h3 class="font-bold text-base text-center mb-1">✨ あなたのコーデ候補</h3><p class="text-[10px] opacity-60 text-center mb-3">${esc(style)} · ${weather?`最高 ${Math.round(weather.max)}℃ / 最低 ${Math.round(weather.min)}℃ / 降水 ${weather.rain}%`:'天気情報なし'}</p><div>${cards}</div><button onclick="openOutfitAdvisor()" class="w-full py-2.5 rounded-xl bg-white/10 text-xs font-bold">条件を変えてもう一度</button><button onclick="closeModal()" class="w-full mt-2 py-2.5 rounded-xl theme-accent-bg text-black text-xs font-bold">閉じる</button>`);

function makeStylingAdvice(items,style,weather){

 if(style==='きれいめ')notes.push('裾や袖を整え、アクセサリーを一点足すと上品に仕上がります');
 if(style==='カジュアル')notes.push('袖を少しまくる、トップスの前だけインするなど、抜け感を作るのがおすすめです');
 if(style==='モード')notes.push('シルエットにメリハリをつけ、アクセサリーは形のはっきりしたものを選ぶと雰囲気が出ます');
 if(style==='大人っぽい')notes.push('素材感を活かし、色数を抑えて小物をシンプルにすると落ち着いた印象になります');
 if(/光沢|サテン/.test(descriptions))notes.push('光沢のある素材が主役になるよう、ほかのアイテムは質感を控えめにすると引き立ちます');
 if(/ゆったり|オーバーサイズ|ワイド/.test(descriptions))notes.push('ゆったりしたアイテムが重なる場合は、袖・裾・ウエストのどこかをすっきり見せるとバランスが取りやすいです');
 if(weather?.rain>=50)notes.push('雨の可能性があるので、濡れて困る素材や靴は避けると安心です');
 if(weather?.min<15)notes.push('朝晩は冷えやすいので、羽織りものを用意するのもおすすめです');

async function fetchWeatherForSelection(offset=dayOffset){
  const main=document.getElementById('selection-weather-main');
  const advice=document.getElementById('selection-weather-advice');
  if(!main)return;

  const place=localStorage.getItem('my_closet_weather_place')||'東京都';
  main.textContent='🌤 天気を取得中…';
  if(advice)advice.textContent='服装を考えています…';

  try{
    const geoRes=await fetch(
      `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(place)}&count=1&language=ja&format=json`
    );
    if(!geoRes.ok)throw new Error('geocoding request failed');

    const geo=await geoRes.json();
    const hit=geo.results?.[0];
    if(!hit)throw new Error('place not found');

    const url=`https://api.open-meteo.com/v1/forecast?latitude=${hit.latitude}&longitude=${hit.longitude}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_mean,weathercode&timezone=Asia%2FTokyo`;
    const res=await fetch(url);
    if(!res.ok)throw new Error('weather request failed');

    const data=await res.json();
    const w=data.daily;
    if(!w || w.temperature_2m_max?.[offset]==null || w.temperature_2m_min?.[offset]==null){
      throw new Error('weather data unavailable');
    }

    const max=Math.round(w.temperature_2m_max[offset]);
    const min=Math.round(w.temperature_2m_min[offset]);
    const rain=w.precipitation_probability_mean?.[offset] ?? 0;
    const code=w.weathercode?.[offset] ?? 0;

    let weatherText='晴れ';
    if(code>=95)weatherText='雷雨';
    else if(code>=80)weatherText='にわか雨';
    else if(code>=71)weatherText='雪';
    else if(code>=51)weatherText='雨';
    else if(code>=45)weatherText='霧';
    else if(code>=1)weatherText='曇り';

    main.innerHTML=`<span>🌤 ${weatherText}</span> ・ ${max}℃ / ${min}℃ ・ 降水 ${rain}%`;

    if(advice){
      const temp=(max+min)/2;
      let message;
      if(temp<8){
        message='今日はかなり寒くなるため、しっかりしたアウターを1枚もっていくといいでしょう。';
      }else if(temp<13){
        message='今日は肌寒い日になるため、薄めの上着を1枚もっていくといいでしょう。';
      }else if(temp<18){
        message='少しひんやりする日なので、軽い羽織りがあると安心です。';
      }else if(temp<23){
        message='朝晩は少し冷えるかもしれません。薄手の羽織りがあると安心です。';
      }else if(temp<28){
        message='過ごしやすい気温です。薄手で動きやすい服装がおすすめです。';
      }else if(temp<32){
        message='暑くなりそうなので、風通しのよい薄手の服がおすすめです。';
      }else{
        message='かなり暑くなりそうなので、できるだけ涼しく通気性のよい服装がおすすめです。';
      }
      advice.textContent=message;
    }
  }catch(e){
    console.error('Selection weather error:',e);
    main.textContent='天気を取得できませんでした';
    if(advice)advice.textContent='天気情報を確認できないため、気温に合わせて服装を選んでください。';
  }
}

async function fetchWeather(){const el=document.getElementById('weather');if(!el)return;const place=localStorage.getItem('my_closet_weather_place')||'東京都';el.innerHTML=`<div class="flex items-center justify-between gap-3"><span>🌤 天気を取得中…</span><button onclick="setWeatherPlace()" class="px-2 py-1 rounded-lg bg-white/10 text-[10px]">${esc(place)}を変更</button></div>`;try{const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(place)}&count=1&language=ja&format=json`).then(r=>r.json());const hit=geo.results?.[0];if(!hit)throw new Error('place not found');const u=`https://api.open-meteo.com/v1/forecast?latitude=${hit.latitude}&longitude=${hit.longitude}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_mean,weathercode&timezone=Asia%2FTokyo`;const d=await fetch(u).then(r=>r.json());const w=d.daily,code=w.weathercode[dayOffset];let text=code>=51?'雨':code>=1?'曇り':'晴れ';el.innerHTML=`<div class="flex items-center justify-between gap-3"><div><div>🌤 ${text} ・ 降水 ${w.precipitation_probability_mean[dayOffset]||0}%</div><div class="text-[9px] opacity-50 mt-1">${esc(place)}</div></div><div class="text-right"><b>${Math.round(w.temperature_2m_max[dayOffset])}℃ / ${Math.round(w.temperature_2m_min[dayOffset])}℃</b><button onclick="setWeatherPlace()" class="block ml-auto mt-1 text-[9px] opacity-60">場所を変更</button></div></div>`}catch(e){el.innerHTML=`<div class="flex items-center justify-between gap-3"><span>天気を取得できませんでした</span><button onclick="setWeatherPlace()" class="px-2 py-1 rounded-lg bg-white/10 text-[10px]">場所を設定</button></div>`}}

dbReady=initDB();
window.addEventListener('DOMContentLoaded',async()=>{applyTheme(themeId);try{await dbReady;await checkLaundry();await switchTab('today')}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="text-center py-10 text-red-300 text-sm">データの読み込みに失敗しました。</div>'}setInterval(checkLaundry,60000)});
</script>
